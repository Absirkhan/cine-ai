<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>CineAI — Full Product Design</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screen-home.jsx"></script>
<script type="text/babel" src="screen-pipeline.jsx"></script>
<script type="text/babel" src="screen-progress.jsx"></script>
<script type="text/babel" src="screen-preview.jsx"></script>
<script type="text/babel" src="screen-edit-agent.jsx"></script>

<script type="text/babel" data-presets="react">
/* global DesignCanvas, DCSection, DCArtboard, HomeScreen, PipelineScreen, ProgressScreen, PreviewScreen, EditAgentScreen */

// Wrap a screen in a fixed-size artboard frame
const Frame = ({ w = 1240, h = 820, children }) => (
  <div className="cai artboard" style={{ width: w, height: h }}>
    {children}
  </div>
);

function App() {
  return (
    <DesignCanvas>
      <DCSection id="full-product" title="CineAI" subtitle="AI-powered animated video generation — five pipeline surfaces, dark cinema aesthetic">
        <DCArtboard id="home"     label="01 · Compose"        width={1240} height={820}>
          <Frame><HomeScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="pipeline" label="02 · Pipeline Dashboard" width={1240} height={820}>
          <Frame><PipelineScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="progress" label="03 · Live Progress"  width={1240} height={820}>
          <Frame><ProgressScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="preview"  label="04 · Video Preview"  width={1240} height={820}>
          <Frame><PreviewScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="edit"     label="05 · Edit Agent"     width={1240} height={820}>
          <Frame><EditAgentScreen/></Frame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
