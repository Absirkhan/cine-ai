<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Animator - CineAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ecff;
            border-color: #667eea;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        select, input[type="number"] {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .preview-area {
            margin-top: 30px;
            display: none;
        }

        .preview-area.show {
            display: block;
        }

        .image-preview, .video-preview {
            max-width: 100%;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 500;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .download-link {
            display: inline-block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .download-link:hover {
            color: #764ba2;
        }

        .selected-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .selected-image.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Image Animator</h1>
        <p class="subtitle">Upload an image and apply cinematic Ken Burns effects</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <p><strong>Click to upload</strong> or drag and drop</p>
            <p style="color: #999; margin-top: 5px;">JPEG or PNG</p>
            <input type="file" id="imageInput" accept="image/jpeg,image/png">
            <img id="selectedImage" class="selected-image" alt="Selected image">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="duration">Duration (seconds)</label>
                <input type="number" id="duration" min="0.5" max="30" step="0.5" value="3.0">
            </div>
            <div class="control-group">
                <label for="effect">Animation Effect</label>
                <select id="effect">
                    <option value="random">Random</option>
                    <option value="zoom_in">Zoom In</option>
                    <option value="zoom_out">Zoom Out</option>
                    <option value="pan_left">Pan Left</option>
                    <option value="pan_right">Pan Right</option>
                </select>
            </div>
        </div>

        <button class="btn" id="animateBtn" disabled>
            Animate Image
        </button>

        <div id="status"></div>

        <div class="preview-area" id="previewArea">
            <h3>Result:</h3>
            <video id="videoPreview" class="video-preview" controls></video>
            <a id="downloadLink" class="download-link" download>📥 Download Video</a>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const selectedImage = document.getElementById('selectedImage');
        const animateBtn = document.getElementById('animateBtn');
        const durationInput = document.getElementById('duration');
        const effectSelect = document.getElementById('effect');
        const statusDiv = document.getElementById('status');
        const previewArea = document.getElementById('previewArea');
        const videoPreview = document.getElementById('videoPreview');
        const downloadLink = document.getElementById('downloadLink');

        let selectedFile = null;

        // Click to upload
        uploadArea.addEventListener('click', () => imageInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        // File input change
        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (!file.type.startsWith('image/')) {
                showStatus('Please select an image file (JPEG or PNG)', 'error');
                return;
            }

            selectedFile = file;

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImage.src = e.target.result;
                selectedImage.classList.add('show');
            };
            reader.readAsDataURL(file);

            animateBtn.disabled = false;
            showStatus(`Selected: ${file.name}`, 'info');
        }

        animateBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('duration', durationInput.value);
            formData.append('effect', effectSelect.value);

            animateBtn.disabled = true;
            previewArea.classList.remove('show');
            showStatus('<span class="loading"></span>Animating your image... This may take a few moments.', 'info');

            try {
                const response = await fetch('http://localhost:8000/api/animate-image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(`✓ ${data.message}`, 'success');

                    // Show video preview
                    videoPreview.src = `http://localhost:8000${data.asset_url}`;
                    downloadLink.href = `http://localhost:8000${data.asset_url}`;
                    downloadLink.download = `animated_${selectedFile.name.split('.')[0]}.mp4`;
                    previewArea.classList.add('show');
                } else {
                    showStatus(`✗ Error: ${data.detail}`, 'error');
                }
            } catch (error) {
                showStatus(`✗ Failed to animate image: ${error.message}`, 'error');
            } finally {
                animateBtn.disabled = false;
            }
        });

        function showStatus(message, type) {
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
